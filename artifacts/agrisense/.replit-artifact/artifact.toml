kind = "web"
previewPath = "/"
title = "AgriSense AI"
description = "A mobile-first crop advisory workspace for farmers and agronomists to manage farms, assess growing conditions, and receive structured, climate-aware recommendations."
version = "1.0.0"
id = "artifacts/agrisense"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25006

[services.development]
run = "pnpm --filter @workspace/agrisense run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agrisense", "run", "build" ]
serve = "static"
publicDir = "artifacts/agrisense/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25006"
BASE_PATH = "/"
